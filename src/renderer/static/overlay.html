<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Perch overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="target" class="target" aria-hidden="true"></div>

    <div id="buddy" class="buddy state-idle" aria-hidden="true">
      <div class="ring"></div>
      <div class="body">
        <span class="eye left"></span>
        <span class="eye right"></span>
      </div>

      <div id="pill" class="pill">
        <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="dots"><i></i><i></i><i></i></span>
        <span id="pill-text" class="pill-text"></span>
      </div>

      <div id="bubble" class="bubble"><div id="bubble-text" class="bubble-text"></div></div>
    </div>

    <script type="module" src="overlay.js"></script>
  </body>
</html>
