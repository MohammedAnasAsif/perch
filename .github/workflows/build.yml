name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds the installer and attaches it.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Unit, integration and acceptance tests: the real app runs headless with a
  # fake AI and fake mouse/keyboard (see docs/TESTING.md).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Integration tests
        run: node scripts/run-e2e.mjs tests/integration --no-build
      - name: Acceptance tests (acting as a user)
        run: node scripts/run-e2e.mjs tests/acceptance --no-build

  # Windows: unit tests, the real mouse/keyboard helper, then the installer.
  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Check the mouse/keyboard helper compiles
        run: node scripts/smoke-input.mjs
      - run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Perch-Setup
          path: release/*.exe
          if-no-files-found: error

      # The installer plus latest.yml / .blockmap, which auto-update reads.
      - name: Attach installer and update files to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
